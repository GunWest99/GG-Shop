<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .card {
            background-color: #2c2c2e;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input {
            width: 80%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-bottom: 10px;
            font-size: 16px;
        }
        button {
            background-color: #f1c40f;
            color: black;
            font-weight: bold;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:active {
            background-color: #d4ac0d;
        }
    </style>
</head>
<body>
    <h1>GG SHOP</h1>
    <p>Купим твой аккаунт Brawl Stars дорого!</p>

    <div class="card">
        <h3>Введи свой тег:</h3>
        <input type="text" id="playerTag" placeholder="#ТвойТег">
        <br>
        <button onclick="checkAccount()">Проверить цену</button>
    </div>

    <div class="card" id="result" style="display: none;">
        <h3>Информация:</h3>
        <p id="resultText">Загрузка...</p>
    </div>

    <script>
        function checkAccount() {
            const tag = document.getElementById('playerTag').value;
            if (!tag) {
                alert('Введи тег!');
                return;
            }
            document.getElementById('result').style.display = 'block';
            document.getElementById('resultText').innerHTML = "Данные по тегу " + tag + " загружаются... (Тут будет цена)";
        }
    </script>
</body>
</html>
