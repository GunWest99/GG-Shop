<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1c1c1e; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .card { background-color: #2c2c2e; border-radius: 15px; padding: 20px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input { width: 80%; padding: 10px; border-radius: 8px; border: none; margin-bottom: 10px; font-size: 16px; }
        button { background-color: #f1c40f; color: black; font-weight: bold; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:active { background-color: #d4ac0d; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #f1c40f; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>GG SHOP</h1>
    <p>Купим твой аккаунт Brawl Stars дорого!</p>

    <div class="card">
        <h3>Введи свой тег:</h3>
        <input type="text" id="playerTag" placeholder="#ТвойТег">
        <br>
        <button onclick="checkAccount()">Проверить цену</button>
    </div>

    <div class="card" id="result" style="display: none;">
        <h3>Информация:</h3>
        <div id="loading" class="loader" style="display: none;"></div>
        <p id="resultText"></p>
    </div>

    <script>
        async function checkAccount() {
            const tag = document.getElementById('playerTag').value.trim().replace('#', '%23');
            if (!tag) {
                alert('Введи тег!');
                return;
            }
            
            document.getElementById('result').style.display = 'block';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultText').innerHTML = "";

            try {
                // ВАЖНО: Сюда мы позже вставим ссылку на наш сервер Wispbyte
                const SERVER_URL = "https://твой-сервер.wispbyte.com/api/check"; 
                
                // Пока заглушка, чтобы ты увидел, как это работает
                // Мы просто имитируем задержку
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('resultText').innerHTML = `Тег: ${tag}<br>Кубки: 130 000<br>Цена: 11 200 руб.`;
                }, 1500);

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultText').innerHTML = "Ошибка загрузки данных.";
            }
        }
    </script>
</body>
</html>
