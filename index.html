<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1c1c1e; color: white; font-family: Arial, sans-serif; padding: 15px; }
        .card { background-color: #2c2c2e; border-radius: 15px; padding: 15px; margin-bottom: 15px; text-align: left; }
        .header { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background-color: #f1c40f; color: black; font-weight: bold; border: none; padding: 15px; border-radius: 8px; font-size: 18px; cursor: pointer; }
        button:active { background-color: #d4ac0d; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 15px; }
        .stat-label { color: #aaa; }
        .stat-value { font-weight: bold; }
        .price { font-size: 22px; color: #f1c40f; font-weight: bold; text-align: center; margin: 15px 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #f1c40f; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>GG SHOP</h1>
        <p>Купим твой аккаунт Brawl Stars дорого!</p>
    </div>

    <div class="card">
        <h3 style="text-align: center; margin-top: 0;">Введи свой тег:</h3>
        <input type="text" id="playerTag" placeholder="#ТвойТег">
        <button onclick="checkAccount()">Проверить цену</button>
    </div>

    <div id="loading" class="loader hidden"></div>

    <div id="resultCard" class="card hidden">
        <h3 id="playerName" style="text-align: center; margin-top: 0;"></h3>
        
        <div class="stat-row"><span class="stat-label">🏆 Кубков:</span> <span class="stat-value" id="trophies"></span></div>
        <div class="stat-row"><span class="stat-label">🥇 Рекорд:</span> <span class="stat-value" id="highestTrophies"></span></div>
        <hr style="border-color: #444;">
        <div class="stat-row"><span class="stat-label">🛡 Бравлеров с макс. силой:</span> <span class="stat-value" id="maxBrawlers"></span></div>
        <div class="stat-row"><span class="stat-label">⭐ Звёздных сил:</span> <span class="stat-value" id="starPowers"></span></div>
        <div class="stat-row"><span class="stat-label">👁 Гаджетов:</span> <span class="stat-value" id="gadgets"></span></div>
        <div class="stat-row"><span class="stat-label">⚡ Гиперзарядов:</span> <span class="stat-value" id="hypercharges"></span></div>
        <hr style="border-color: #444;">
        <div class="stat-row"><span class="stat-label">⚔ Победы 3х3:</span> <span class="stat-value" id="victories3v3"></span></div>
        <div class="stat-row"><span class="stat-label">🥇 Победы соло:</span> <span class="stat-value" id="victoriesSolo"></span></div>
        <div class="stat-row"><span class="stat-label">👥 Победы дуо:</span> <span class="stat-value" id="victoriesDuo"></span></div>

        <div class="price">Мы готовы купить за: <span id="priceValue"></span> ₽</div>
        <button style="background-color: #2ecc71;" onclick="sellAccount()">💰 Продать аккаунт</button>
    </div>

    <script>
        // Используем прокси allorigins, который не требует ключей и работает стабильно
        const SERVER_URL = "https://api.allorigins.win/raw?url=http://78.154.103.41:12383/api/check";

        async function checkAccount() {
            const tagInput = document.getElementById('playerTag').value.trim();
            if (!tagInput) { alert('Введи тег!'); return; }
            
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultCard').classList.add('hidden');

            try {
                const response = await fetch(`${SERVER_URL}?tag=${encodeURIComponent(tagInput)}`);
                const data = await response.json();

                if (data.error) {
                    alert("Ошибка: " + data.error);
                } else {
                    document.getElementById('playerName').innerText = data.name;
                    document.getElementById('trophies').innerText = data.trophies;
                    document.getElementById('highestTrophies').innerText = data.highestTrophies;
                    document.getElementById('maxBrawlers').innerText = data.maxBrawlers;
                    document.getElementById('starPowers').innerText = data.starPowers;
                    document.getElementById('gadgets').innerText = data.gadgets;
                    document.getElementById('hypercharges').innerText = data.hypercharges;
                    document.getElementById('victories3v3').innerText = data.victories3v3;
                    document.getElementById('victoriesSolo').innerText = data.victoriesSolo;
                    document.getElementById('victoriesDuo').innerText = data.victoriesDuo;
                    document.getElementById('priceValue').innerText = data.price;

                    document.getElementById('resultCard').classList.remove('hidden');
                }
            } catch (e) {
                alert("Ошибка соединения с сервером. Проверь, запущен ли Wispbyte.");
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function sellAccount() {
            alert("Тут будет логика продажи (выдача почты и т.д.)");
        }
    </script>
</body>
</html>
